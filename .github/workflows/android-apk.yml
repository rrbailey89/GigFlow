name: Build GigFlow Android APK

on:
  # Run automatically when Android source or this workflow changes.
  push:
    branches: [master]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  # Allow a rebuild whenever you want from the Actions tab.
  workflow_dispatch:

# The workflow only needs to read the repository and upload run artifacts.
permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK components
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      # This repository has no Gradle wrapper. AGP 9.0.0 requires Gradle 9.1.0+.
      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK and SHA-256 checksum
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/GigFlow-Uber-Lyft-Fixed-debug.apk
          cd output
          sha256sum GigFlow-Uber-Lyft-Fixed-debug.apk > SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GigFlow-Uber-Lyft-Fixed-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 30
